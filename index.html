<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernpfad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem("lp-mode");if(m==="light"||m==="dark")document.documentElement.setAttribute("data-mode",m);}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Apple-style look (iOS/macOS Human Interface Guidelines): system type with large titles, grouped inset cells,
   hairline separators, translucent bars, iOS controls and spring-like motion. Tint: systemOrange (like Books) with black text on filled controls; a darker orange for plain text in light mode. */
:root{
  --paper:#F2F2F7; --card:#FFFFFF; --sunken:#E9E9EE; --ink:#000000; --muted:rgba(60,60,67,.78); --faint:rgba(60,60,67,.32);
  --line:rgba(60,60,67,.14); --line-strong:rgba(60,60,67,.24); --fill:rgba(120,120,128,.12); --fill2:rgba(118,118,128,.18); --thumb:#FFFFFF;
  --bar:rgba(249,249,251,.80); --side:rgba(242,242,247,.86);
  --accent:#FF9500; --accent-soft:rgba(255,149,0,.16); --on-accent:#000000; --primary:#FF9500; --on-primary:#000000; --tint-text:#A84600; --progress:#FF9500;
  --good:#1A7430; --good-soft:rgba(52,199,89,.14); --warn:#C93400; --warn-soft:rgba(255,149,0,.14); --bad:#D70015; --bad-soft:rgba(255,59,48,.12);
  --switch-on:#34C759; --badge:#FF3B30; --hud:rgba(30,30,32,.86); --on-hud:#FFFFFF;
  --shadow:0 20px 60px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.06); --sheet-shadow:0 -4px 24px rgba(0,0,0,.06); --cellshadow:0 0 0 .5px rgba(0,0,0,.04);
  color-scheme:light;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, "Segoe UI", sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --spring:cubic-bezier(0.32, 0.72, 0, 1); --ease:cubic-bezier(0.25, 0.1, 0.25, 1);
}
@media (prefers-color-scheme: dark){ :root:not([data-mode="light"]):not([data-theme="light"]){
  --paper:#000000; --card:#1C1C1E; --sunken:#2C2C2E; --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
  --line:rgba(84,84,88,.48); --line-strong:rgba(84,84,88,.75); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --thumb:#636366;
  --bar:rgba(22,22,24,.78); --side:rgba(28,28,30,.82);
  --accent:#FF9F0A; --accent-soft:rgba(255,159,10,.2); --on-accent:#000000; --primary:#FF9F0A; --on-primary:#000000; --tint-text:#FF9F0A; --progress:#FF9F0A;
  --good:#30D158; --good-soft:rgba(48,209,88,.16); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16); --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --switch-on:#30D158; --badge:#FF453A; --hud:rgba(58,58,60,.88); --on-hud:#FFFFFF;
  --shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.08); --sheet-shadow:0 -8px 30px rgba(0,0,0,.6); --cellshadow:none;
  color-scheme:dark;
} }
:root[data-mode="dark"], :root[data-theme="dark"]:not([data-mode="light"]){
  --paper:#000000; --card:#1C1C1E; --sunken:#2C2C2E; --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.3);
  --line:rgba(84,84,88,.48); --line-strong:rgba(84,84,88,.75); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.32); --thumb:#636366;
  --bar:rgba(22,22,24,.78); --side:rgba(28,28,30,.82);
  --accent:#FF9F0A; --accent-soft:rgba(255,159,10,.2); --on-accent:#000000; --primary:#FF9F0A; --on-primary:#000000; --tint-text:#FF9F0A; --progress:#FF9F0A;
  --good:#30D158; --good-soft:rgba(48,209,88,.16); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16); --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --switch-on:#30D158; --badge:#FF453A; --hud:rgba(58,58,60,.88); --on-hud:#FFFFFF;
  --shadow:0 20px 60px rgba(0,0,0,.7), 0 0 0 .5px rgba(255,255,255,.08); --sheet-shadow:0 -8px 30px rgba(0,0,0,.6); --cellshadow:none;
  color-scheme:dark;
}

/* ---- base & type (SF scale: large title 34, title 22/20, headline 17, body 17/16, subhead 15, footnote 13, caption 12) ---- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.47 var(--body);letter-spacing:-0.011em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01"}
a{color:var(--ink);text-decoration:none} a:hover{opacity:.75}
.prose a{color:var(--tint-text)}
nav a,a.btn,a.nav{text-decoration:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.125rem;font-weight:700;letter-spacing:-0.025em}
h2{font-size:1.25rem;font-weight:650;letter-spacing:-0.018em}
h3{font-size:1.0625rem;font-weight:600;letter-spacing:-0.014em}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.8125rem;line-height:1.38}
.eyebrow{font-size:.8125rem;color:var(--muted);font-weight:500;letter-spacing:-0.004em}
.sp{flex:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:20px}

/* ---- layout: macOS sidebar + content ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
nav.side{padding:14px 10px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border-right:.5px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;margin:4px 10px 14px;font-weight:700;font-size:1.0625rem;letter-spacing:-0.02em}
.logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#FFB340,#FF8A00);display:grid;place-items:center;color:#000}
.logo svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.cmdk{display:flex;align-items:center;gap:7px;margin:0 2px 12px;padding:0 10px;height:34px;border:0;border-radius:10px;background:var(--fill);color:var(--muted);font-size:.9375rem;cursor:pointer;text-align:left}
.cmdk .sp{flex:1} .cmdk>span:not(.kbd):not(.sp){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav a.nav{display:flex;align-items:center;gap:10px;padding:0 10px;height:34px;border-radius:8px;color:var(--ink);font-size:.9375rem;font-weight:500;transition:background .2s var(--ease)}
nav a.nav svg.i{width:18px;height:18px;color:var(--muted)}
nav a.nav:hover{background:var(--fill);opacity:1}
nav a.nav.on{background:var(--fill2);font-weight:600}
nav a.nav.on svg.i,nav a.nav:hover svg.i{color:var(--tint-text)}
nav .count{margin-left:auto;font-size:.75rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:44px clamp(18px,4vw,56px) 96px;max-width:1040px;width:100%}
main.enter > *{animation:viewin .42s var(--spring) both}

/* ---- grouped cells ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:0;border-radius:14px;padding:16px 18px;box-shadow:var(--cellshadow)}
.card h3{margin-bottom:2px}
.topic-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tile{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--cellshadow)}
.tile .btn{align-self:flex-start}
.tile .n{font-family:var(--display);font-size:2.125rem;font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1}
.notice{background:var(--card);padding:12px 16px;border-radius:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-weight:500}

/* ---- buttons (filled / tinted / plain), press feedback like UIKit ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;white-space:nowrap;border:0;background:var(--fill);border-radius:10px;padding:0 14px;height:36px;cursor:pointer;color:var(--tint-text);font-size:.9375rem;font-weight:550;letter-spacing:-0.01em;transition:transform .35s var(--spring),opacity .2s,background .2s}
.btn:hover{background:var(--fill2);opacity:1}
.btn:active{transform:scale(.96);opacity:.75;transition-duration:.08s}
.btn.primary,.btn.blaze{background:var(--primary);color:var(--on-primary);font-weight:600}
.btn.primary:hover,.btn.blaze:hover{background:var(--primary);opacity:.88}
.btn.ghost{background:transparent;color:var(--tint-text);font-weight:500}
.btn.ghost:hover{background:var(--fill)}
.btn.ghost.on{background:var(--accent-soft)}
.btn.sm{height:30px;padding:0 11px;font-size:.875rem;border-radius:8px}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;font:500 .6875rem var(--body);color:var(--muted);background:var(--fill);border-radius:5px}
@media (hover:none){.hint{display:none!important}}
.btn.primary .kbd,.btn.blaze .kbd{background:transparent;color:inherit;opacity:.55}
.iconbtn{padding:0 8px;font-size:1.05rem}

/* ---- chips, segmented control, fields, switches ---- */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:.8125rem;font-weight:500;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.blz{background:var(--accent-soft);color:var(--tint-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{border:0;background:transparent;padding:0 13px;height:28px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:.8125rem;font-weight:500;transition:background .25s var(--spring),box-shadow .25s var(--spring)}
.seg button.on{background:var(--thumb);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;font-weight:500;color:var(--muted)}
input[type=text],textarea,select{width:100%;border:0;background:var(--fill);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:1rem;font-weight:400;transition:box-shadow .2s var(--ease),background .2s}
input[type=text]:focus,textarea:focus,select:focus{outline:none;background:var(--fill);box-shadow:0 0 0 3.5px var(--accent-soft),0 0 0 1px var(--accent) inset}
textarea{min-height:84px;resize:vertical}
::placeholder{color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:center;font-weight:400;font-size:.9375rem}
label.chk input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:44px;height:27px;border-radius:99px;background:var(--fill2);position:relative;cursor:pointer;margin:0;transition:background .3s var(--spring)}
label.chk input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#FFF;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring)}
label.chk input[type=checkbox]:checked{background:var(--switch-on)}
label.chk input[type=checkbox]:checked::after{transform:translateX(17px)}

/* ---- trail & steps ---- */
.trail{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.trail .segs{display:flex;gap:3px;width:150px}
.trail .segs i{flex:1;height:4px;border-radius:2px;background:var(--fill2)}
.trail .segs i.done{background:var(--progress)}
.trail .segs i.doing{background:linear-gradient(90deg,var(--progress) 50%,var(--fill2) 50%)}
.steps{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:7px 0;align-items:start;font-size:.9375rem;border-bottom:.5px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li.done span{color:var(--muted)}
.st{width:15px;height:15px;margin-top:3px}

/* ---- reading ---- */
.prose{max-width:66ch;font-size:1.0625rem;line-height:1.55;letter-spacing:-0.012em}
.prose h1{font-size:1.375rem;margin:.9em 0 .3em}.prose h2{font-size:1.1875rem;margin:1.2em 0 .35em}.prose h3{font-size:1.0625rem;margin:1em 0 .25em}
.prose p{margin:.55em 0}.prose ul,.prose ol{padding-left:1.25em;margin:.45em 0}.prose li{margin:.2em 0}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--fill);padding:1px 5px;border-radius:5px}
.prose pre{background:var(--card);padding:12px 14px;border-radius:12px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.9375rem}
.prose th,.prose td{border-bottom:.5px solid var(--line);padding:7px 10px;text-align:left}
.prose blockquote{margin:.6em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--fill2);color:var(--muted)}
.prose strong{font-weight:650}

/* ---- study: translucent nav bar, messages, question sheet ---- */
.study{display:flex;flex-direction:column;gap:12px}
.studyhead{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:8px 0;margin:0 -4px;padding-left:4px;padding-right:4px;border-bottom:.5px solid var(--line);display:flex;align-items:center;gap:8px;min-width:0}
.studyhead .stitle{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden;white-space:nowrap;flex:1 1 auto}
.studyhead .stitle b{font-size:1.0625rem;font-weight:600;letter-spacing:-0.02em;overflow:hidden;text-overflow:ellipsis}
.studyhead .eyebrow{font-size:.8125rem}
.studyhead .trail .segs{width:90px}
.studyhead > .sp{display:none}
.studyhead > :not(.stitle){flex:none}
main.studying{padding-top:0;padding-bottom:0;min-width:0;overflow-x:clip}
.study,.msgs,.dock{min-width:0}
.confg{display:flex;align-items:center;gap:8px;margin-left:auto}
#timeChip{gap:0}
.msgs{display:flex;flex-direction:column;gap:20px;padding-top:4px}
.msg{animation:msgin .45s var(--spring) both}
.msg.t{padding:2px 0}
.msg.t .who{font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.msg.l{align-self:flex-end;max-width:80%;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:9px 15px;white-space:pre-wrap;font-size:1rem;line-height:1.4}
.fb{border-radius:12px;padding:10px 14px;font-size:.9375rem;display:flex;gap:8px;align-items:flex-start}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)} .fb.warn{background:var(--warn-soft)}
.fb b{white-space:nowrap}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)} .fb.warn b{color:var(--warn)}
.thinking{color:var(--muted);font-size:.9375rem}
.dock{position:sticky;bottom:0;display:flex;flex-direction:column;gap:9px;max-height:48vh;overflow-y:auto;overscroll-behavior:contain;background:var(--card);border:0;border-radius:18px;padding:14px 16px 12px;margin-bottom:12px;box-shadow:var(--sheet-shadow)}
.dock .ask{font-size:1rem}
.dock textarea,.dock input[type=text]{background:var(--fill)}
.dock .seg{background:var(--fill)}
.dock textarea{min-height:46px;max-height:30vh}
.dock .bar.small{gap:4px;flex-wrap:wrap}
.sheet-anim{overflow:hidden!important;will-change:height;max-height:none!important}
.sheet-anim > *{flex-shrink:0}
.row2.sideq{display:none}
.row2.sideq.open{display:flex}
.grab{display:none}
.ask{font-weight:600;font-size:1.0625rem;letter-spacing:-0.016em;line-height:1.35}
.ask p{margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:var(--fill);border-radius:12px;padding:11px 14px;cursor:pointer;min-height:44px;font-size:1rem;transition:background .2s var(--ease),transform .35s var(--spring)}
.opt:hover{background:var(--fill2)}
.opt:active{transform:scale(.98)}
.opt.right{background:var(--good-soft);box-shadow:inset 0 0 0 1.5px var(--good)}
.opt.picked{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt.wrong{background:var(--bad-soft);box-shadow:inset 0 0 0 1.5px var(--bad)}
.row2{display:flex;gap:8px;align-items:flex-end}
.row2 textarea{min-height:52px}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:3px}
.micwrap #micBtn{width:36px;height:36px;padding:0;border-radius:50%}
.micwrap #micBtn.blaze{background:var(--bad);color:#FFF}
.langbtn{color:var(--tint-text);font-weight:650;letter-spacing:.02em;font-size:.75rem;height:22px;padding:0 7px;border-radius:6px}
#dictTip{margin-top:2px}

/* ---- review ---- */
.flash{min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:14px;font-size:1.1875rem}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:0;height:auto;padding:10px 0;border-radius:12px}
.rate .btn small{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.rate .btn.primary small{color:inherit;opacity:.7}

/* ---- stats ---- */
.chart{display:flex;flex-direction:column;gap:4px}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line-strong)}
.bars .col{flex:1 1 0;min-width:0;height:100%;display:flex;align-items:flex-end;cursor:default;border-radius:4px 4px 0 0}
.bars .col i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.bars .col:hover,.bars .col.on{background:var(--fill)}
.xlab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ymax{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ctip{font-size:.875rem;min-height:1.4em;font-variant-numeric:tabular-nums}
.stbl{width:100%;border-collapse:collapse;font-size:.9375rem;font-variant-numeric:tabular-nums}
.stbl th,.stbl td{padding:8px 6px;border-bottom:.5px solid var(--line);text-align:right;white-space:nowrap}
.stbl th{font-size:.8125rem;color:var(--muted);font-weight:500}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl .muted{font-size:.8125rem}

.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ---- HUD toast, alerts & sheets, command palette ---- */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--hud);color:var(--on-hud);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:11px 20px;border-radius:99px;z-index:60;max-width:90vw;font-size:.9375rem;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .5s var(--spring) both}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding:12vh 16px 16px;animation:fadein .25s var(--ease) both}
.modal .card{max-width:540px;width:100%;box-shadow:var(--shadow);border-radius:16px;padding:20px;animation:alertin .4s var(--spring) both;max-height:80vh;overflow:auto}
.palette{padding:0!important;overflow:hidden;gap:0!important}
.palette input{border:0!important;border-bottom:.5px solid var(--line)!important;border-radius:0!important;padding:15px 18px!important;font-size:1.0625rem!important;box-shadow:none!important;background:transparent!important}
.palette .list{max-height:52vh;overflow:auto;padding:6px}
.palette .it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.9375rem}
.palette .it .muted{font-size:.8125rem}

<body>
<div class="app">
  <nav class="side" id="sidenav" aria-label="Main"></nav>
  <main id="main"><p class="muted">Loading Lernpfad…</p></main>
</div>
<nav class="bottom" id="bottomnav" aria-label="Main"></nav>
<div id="overlay"></div>
<div id="toastLive" class="sr-only" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------------- utilities ---------------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (p="") => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const DAY = 86400000;
const nowIso = () => new Date().toISOString();
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const ymd = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
function md(text){
  const t = String(text ?? "");
  try{
    if (window.marked && window.DOMPurify){
      return DOMPurify.sanitize(marked.parse(t, {breaks:true, gfm:true}));
    }
  }catch(e){}
  // small fallback renderer if the Markdown library can't load
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  let out = "", list = false;
  for (const line of t.split("\n")){
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li){ if (!list){ out += "<ul>"; list = true; } out += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (list){ out += "</ul>"; list = false; }
    if (h) out += "<h" + (h[1].length+1) + ">" + inline(h[2]) + "</h" + (h[1].length+1) + ">";
    else if (line.trim()) out += "<p>" + inline(line) + "</p>";
  }
  return out + (list ? "</ul>" : "");
}
const I = {
  today:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  topics:'<svg class="i" viewBox="0 0 24 24"><path d="M4 19l5-14 4 9 3-5 4 10"/></svg>',
  review:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  stats:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  set:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  spk:'<svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>'
};
function toast(msg, ms=2600){
  $$(".toast").forEach(x => x.remove());
  const d = document.createElement("div"); d.className="toast"; d.textContent=msg; d.setAttribute("aria-hidden","true");
  document.body.appendChild(d); setTimeout(()=>d.remove(), ms);
  const lv = $("#toastLive"); if (lv){ lv.textContent = ""; setTimeout(() => { lv.textContent = msg; }, 50); }
}
/* opts.persistent: Escape and backdrop clicks do nothing (progress dialogs). opts.onDismiss: runs when Escape or a backdrop click closes it. */
const FOCUSABLE = 'button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])';
function dialog(html, onMount, opts){
  opts = opts || {};
  const o = $("#overlay"), prev = document.activeElement;
  o.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="card stack" tabindex="-1">'+html+'</div></div>';
  const modal = $(".modal", o), card = $(".card", modal);
  const head = $("h2,h3", card);
  if (head){ head.id = "dlgTitle"; modal.setAttribute("aria-labelledby", "dlgTitle"); } else modal.setAttribute("aria-label", opts.label || "Dialog");
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    if (!o.contains(modal)) return;   // another dialog already replaced this one
    o.innerHTML = "";
    try{ if (prev && prev !== document.body && document.contains(prev)) prev.focus(); }catch(e){}
  };
  modal._dismiss = () => { if (opts.persistent) return; close(); if (opts.onDismiss) opts.onDismiss(); };
  modal.addEventListener("click", e => { if (e.target === modal) modal._dismiss(); });
  modal.addEventListener("keydown", e => {
    if (e.key !== "Tab") return;
    const f = $$(FOCUSABLE, card).filter(x => x.offsetParent !== null);
    if (!f.length){ e.preventDefault(); return; }
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !card.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
  onMount && onMount(card, close);
  if (!card.contains(document.activeElement)){ const f = $(FOCUSABLE, card); (f || card).focus(); }
  return close;
}
function confirmBox(text, yesLabel="Yes"){
  return new Promise(res => {
    dialog('<p>'+esc(text)+'</p><div class="bar"><span class="sp"></span><button class="btn" id="cNo">Cancel</button><button class="btn primary" id="cYes">'+esc(yesLabel)+'</button></div>', (el, close) => {
      $("#cNo",el).onclick = () => { close(); res(false); };
      $("#cYes",el).onclick = () => { close(); res(true); };
    }, {onDismiss: () => res(false), label: text});
  });
}
const sampleErr = e => ({
  not_granted:"Claude access is off for this page. Allow it when asked, or reload to be asked again.",
  sampling_disabled:"Claude isn't available on this account right now.",
  rate_limited:"You've hit a usage limit for now. Try again in a little while.",
  session_expired:"Please sign in to Claude again.",
  refused:"Claude declined that request. Try rephrasing.",
  prompt_too_large:"That was too much text at once. Select fewer chats or shorter text.",
  invalid_json:"Claude's reply came back in the wrong format. Try again.",
  empty_completion:"Claude returned nothing. Try again.",
  cancelled:"Stopped.",
  save_failed:"Couldn't save to your account. Check your connection."
}[e && e.code] || "Something went wrong talking to Claude. Try again.");

/* ---------------- state ---------------- */
const S = {
  db:null, sample:null, dl:null, dict:null, tts:null, ready:false, noClaude:false, loadTimedOut:false,
  profile:null, settings:{}, topics:{}, cards:{}, kcs:{}, openSessions:{}, materials:{}, stats:{},
  route:"today", arg:null, live:null /* active study session */, busy:false, ctl:null, review:null
};
const DEFAULT_SETTINGS = { vault:"Obsidian Vault", folder:"Learning", depth:"default", weekdayMin:15, weekendMin:40, mode:"system" };
function applyMode(mode){ const r = document.documentElement; if (mode === "light" || mode === "dark") r.setAttribute("data-mode", mode); else r.removeAttribute("data-mode"); try{ localStorage.setItem("lp-mode", mode || "system"); }catch(e){} }
const st = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {});
const writeQ = {};
const lastFailToast = {};
/* Resolves to true when the write went through and false when it failed, so callers can tell. */
function queueWrite(path, fn){
  writeQ[path] = (writeQ[path] || Promise.resolve()).then(fn).then(() => true, e => {
    console.warn("write failed", path, e);
    const msg = e && e.code === "quota_exceeded" ? "Storage is full. Delete old topics or cards." : "Couldn't save your change. Check your connection and try again.";
    if (Date.now() - (lastFailToast[msg] || 0) > 5000){ lastFailToast[msg] = Date.now(); toast(msg, 4500); }
    return false;
  });
  return writeQ[path];
}
const saveTopic = (id, data) => { if(!S.db) return; Object.assign(S.topics[id] ||= {}, data); return queueWrite("topics/"+id, () => S.db.doc("topics/"+id).set(clean(S.topics[id]))); };
const saveProfile = data => { if(!S.db) return; S.profile = Object.assign({}, S.profile||{}, data, {updatedAt:nowIso()}); return queueWrite("lp/profile", () => S.db.doc("lp/profile").set(clean(S.profile))); };
const saveSettings = data => { if(!S.db) return; S.settings = Object.assign({}, st(), data); return queueWrite("lp/settings", () => S.db.doc("lp/settings").set(clean(S.settings))); };
const saveCard = (id, c) => { if(!S.db) return; S.cards[id] = c; return queueWrite("cards/"+id, () => S.db.doc("cards/"+id).set(clean(c))); };
const saveKc = (id, k) => { if(!S.db) return; S.kcs[id] = k; return queueWrite("kcs/"+id, () => S.db.doc("kcs/"+id).set(clean(k))); };
/* A knowledge component (KC) is one plan step. Same FSRS fields as a card, so schedule() works on it unchanged. */
const kcId = (topicId, stepId) => topicId + "-" + stepId;
function syncKcs(topicId){
  const t = S.topics[topicId]; if (!t || !Array.isArray(t.plan)) return Promise.resolve();
  const now = new Date().toISOString(), jobs = [];
  t.plan.forEach((p, i) => {
    const id = kcId(topicId, p.id), have = S.kcs[id];
    if (have){ if (have.title !== p.title) jobs.push(saveKc(id, Object.assign({}, have, {title: p.title}))); return; }
    const kc = {topicId, stepId: p.id, title: p.title, kind:"concept", prereqs: i ? [kcId(topicId, t.plan[i-1].id)] : [], stage: p.status === "done" ? "solo" : p.status === "doing" ? "completion" : "example", createdAt: now, due: now, reps:0, lapses:0};
    if (p.status === "done") Object.assign(kc, {s: W[2], d: initD(3), last: now, reps:1}); // learned: as if answered Good once, due today
    jobs.push(saveKc(id, kc));
  });
  return Promise.all(jobs);
}
/* Learned KCs due now, for topics still active and steps still in the plan. */
function kcsDue(now){
  return Object.entries(S.kcs).filter(([id, k]) => { const t = S.topics[k.topicId]; return k.s && Date.parse(k.due) <= now && t && (t.status || "active") === "active" && (t.plan || []).some(p => p.id === k.stepId); });
}
const saveSession = sess => { if(!S.db) return; return queueWrite("sessions/"+sess.id, () => S.db.doc("sessions/"+sess.id).set(clean(sess))); };
function clean(o){ return JSON.parse(JSON.stringify(o, (k,v) => v === undefined ? null : v)); }

/* ---------------- capabilities ---------------- */
async function init(){
  renderNav(); route();
  window.addEventListener("hashchange", route);
  if (!window.claude || !window.claude.use){ S.noClaude = true; S.ready = true; render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, sample, dl, dict, tts] = await Promise.all([use("db"), use("sample"), use("downloads"), use("dictation"), use("tts")]);
  Object.assign(S, {db, sample, dl, dict, tts});
  if (dict){
    try{
      dict.onPartial(({text}) => spPartial(text));
      dict.onFinal(({text}) => { const ta = S.dictTarget; if (ta && document.body.contains(ta)){ ta.value = ta.value ? ta.value + text : text.replace(/^\s+/, ""); spFinal(ta, text); } });
      dict.onState(({state, reason}) => {
        S.dictOn = state !== "idle";
        if (state === "listening" && S.sp) S.sp.lastAt = 0;
        if (S.dictBtn && document.body.contains(S.dictBtn)) S.dictBtn.classList.toggle("blaze", S.dictOn);
        const tip = document.getElementById("dictTip"); if (tip) tip.hidden = !S.dictOn;
        if (state === "idle" && reason === "unavailable" && S.dictLangTried){ S.dictLangOk = false; const lb = document.getElementById("langBtn"); if (lb) lb.remove(); }
      });
    }catch(e){ S.dict = null; }
  }
  if (!db){ S.ready = true; render(); return; }
  const timer = setTimeout(() => { S.loadTimedOut = true; render(); }, 10000);
  let got = 0; const mark = () => { if (++got >= 3){ clearTimeout(timer); S.loadTimedOut = false; S.ready = true; } render(); };
  const onErr = e => { console.warn(e); clearTimeout(timer); S.ready = true; render(); };
  let pOnce=false, tOnce=false, cOnce=false, kOnce=false;
  function migrateKcs(){ if (tOnce && kOnce && !S.kcMigrated){ S.kcMigrated = true; Object.keys(S.topics).forEach(syncKcs); } }
  db.doc("lp/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : null; if(!pOnce && !s.metadata.fromCache){pOnce=true; mark();} else render(); }, onErr);
  db.doc("lp/settings").onSnapshot(s => { S.settings = s.exists ? s.data() : {}; applyMode(st().mode); render(); }, onErr);
  db.collection("topics").onSnapshot(q => { const t={}; q.docs.forEach(d => t[d.id] = Object.assign({}, d.data())); S.topics = t; if(!tOnce && !q.metadata.fromCache){tOnce=true; mark(); migrateKcs();} else render(); }, onErr);
  db.collection("cards").onSnapshot(q => { const c={}; q.docs.forEach(d => c[d.id] = Object.assign({}, d.data())); S.cards = c; if(!cOnce && !q.metadata.fromCache){cOnce=true; mark();} else render(); }, onErr);
  db.collection("kcs").onSnapshot(q => { const m = {}; q.docs.forEach(d => m[d.id] = Object.assign({}, d.data())); S.kcs = m; if (!kOnce && !q.metadata.fromCache){ kOnce = true; migrateKcs(); } render(); }, e => console.warn(e));
  db.collection("stats").onSnapshot(q => { const m = {}; q.docs.forEach(d => m[d.id] = d.data()); S.stats = m; if (S.route === "stats") render(); }, e => console.warn(e));
  db.collection("materials").onSnapshot(q => { const m = {}; q.docs.forEach(d => m[d.id] = d.data()); S.materials = m; render(); }, e => console.warn(e));
  db.collection("sessions").where("status","==","open").onSnapshot(q => { const o={}; q.docs.forEach(d => o[d.id] = d.data()); S.openSessions = o; render(); }, onErr);
}

/* ---------------- routing ---------------- */
function route(ev){
  const h = (location.hash || "#today").slice(1);
  if (ev && ev.type === "hashchange" && S.skipNext === h){ S.skipNext = null; return; }
  if (h.startsWith("topic-")){ S.route = "topic"; S.arg = h.slice(6); }
  else if (["today","topics","review","stats","settings","study"].includes(h)){ S.route = h; S.arg = null; }
  else { S.route = "today"; }
  if (S.route === "study" && !S.live){ S.route = "today"; }
  if (S.route === "review") S.review = null;
  render(true);
}
const go = h => { if (location.hash !== "#"+h){ S.skipNext = h; location.hash = h; } route(); };

function dueCards(topicId){
  const n = Date.now();
  return Object.entries(S.cards).filter(([id,c]) => !c.suspended && (!topicId || c.topicId === topicId) && (!c.due || Date.parse(c.due) <= n));
}
function renderNav(){
  const due = dueCards().length;
  const items = [["today","Today",I.today],["topics","Topics",I.topics],["review","Review",I.review],["stats","Stats",I.stats],["settings","Settings",I.set]];
  const cur = S.route === "topic" ? "topics" : S.route === "study" ? "topics" : S.route;
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || "");
  $("#sidenav").innerHTML = '<div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 13c3 0 3-5 6-5s3-5 6-5"/></svg></span><span>Lernpfad</span></div>' +
    '<button class="cmdk" id="cmdkBtn">'+I.search+'<span>Search or jump to…</span><span class="sp"></span><span class="kbd">'+(mac?"⌘":"Ctrl")+'</span><span class="kbd">K</span></button>' +
    items.map(([k,l,ic]) => '<a class="nav'+(cur===k?' on':'')+'" href="#'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+ic+l+(k==="review"&&due?'<span class="count">'+due+'</span>':'')+'</a>').join("") +
    '<span class="sp"></span><p class="small" style="margin:0 10px;color:var(--muted)">Synced on every device you open it on.</p>';
  const cb = $("#cmdkBtn"); if (cb) cb.onclick = openPalette;
  $("#bottomnav").innerHTML = items.map(([k,l,ic]) => '<a class="'+(cur===k?'on':'')+'" href="#'+k+'"'+(cur===k?' aria-current="page"':'')+'>'+ic+'<span>'+l+'</span>'+(k==="review"&&due?'<span class="count">'+due+'</span>':'')+'</a>').join("");
}

/* render: skip full re-render while the person is typing on a form view */
function render(force){
  renderNav();
  const main = $("#main");
  const typing = document.activeElement && main.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (!force && (S.route === "study" || S.route === "review" || (typing && ["settings","topic"].includes(S.route)))) {
    if (S.route === "study") updateStudyHead();
    return;
  }
  const fn = {today:viewToday, topics:viewTopics, topic:viewTopic, study:viewStudy, review:viewReview, stats:viewStats, settings:viewSettings}[S.route] || viewToday;
  main.classList.toggle("studying", S.route === "study"); document.body.classList.toggle("studying", S.route === "study");
  if (S._lastView !== S.route + (S.arg||"")){ S._lastView = S.route + (S.arg||""); main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter"); setTimeout(() => main.classList.remove("enter"), 600); }
  main.innerHTML = gate() || fn();
  const after = {today:bindToday, topics:bindTopics, topic:bindTopic, study:bindStudy, review:bindReview, stats:bindStats, settings:bindSettings}[S.route];
  if (!gate() && after) after();

function gate(){

/* ---------------- day logic (routine-aware) ---------------- */
function dayPlan(){
  const d = new Date().getDay(); const s = st();
  if (d === 0) return {kind:"sunday", minutes:10, label:"Sunday · light", tip:"A light day. A few review cards is plenty."};
  if (d === 6) return {kind:"weekend", minutes:s.weekendMin, label:"Saturday · deep work", tip:"Good day for a longer lesson on a hard topic."};
  return {kind:"weekday", minutes:s.weekdayMin, label:"Weekday · short session", tip:"Keep it short: reviews, or one small step on a light topic."};
}
const fitOk = (t, kind) => !t.fit || t.fit === "any" || (kind === "weekday" ? t.fit === "weekday" : t.fit === "weekend") || kind === "sunday";

function noteFileName(t){ return (t.title || "Topic").replace(/:/g, " -").replace(/[\\/*?"<>|#^\[\]]/g, "-").replace(/\s+/g," ").trim().slice(0,90); }
function noteMarkdown(t){
  const body = (t.summaryMd && t.summaryMd.trim()) ? t.summaryMd.trim() :
    "## Why\n" + (t.why || "-") + "\n\n## Where I am\n" + (t.level || "Not assessed yet.") + "\n\n## Plan\n" + ((t.plan||[]).map(p => "- [" + (p.status==="done"?"x":" ") + "] " + p.title).join("\n") || "- Made in the first lesson") + "\n";
  const fm = ["---", "topic: \"" + (t.title||"").replace(/"/g,"'") + "\"", "level: \"" + (t.level||"").replace(/"/g,"'") + "\"", "status: " + (t.status||"active"), "updated: " + ymd(t.updatedAt || Date.now()), "source: Lernpfad", "tags: [learning]", "---", ""].join("\n");
  let out = fm + "# " + (t.title||"") + "\n\n" + body + "\n";
  if (t.plan && t.plan.length && !/##\s*Plan|##\s*Trail/i.test(body)) out += "\n## Trail\n" + t.plan.map(p => "- [" + (p.status==="done"?"x":" ") + "] " + p.title).join("\n") + "\n";
  return out;
}
function obsidianUri(t){
  const s = st();
  return "obsidian://new?vault=" + encodeURIComponent(s.vault) + "&file=" + encodeURIComponent(s.folder + "/" + noteFileName(t)) + "&content=" + encodeURIComponent(noteMarkdown(t)) + "&overwrite=true";
}

}

/* ---------------- teaching engine ---------------- */
const TEACHER_RULES = `You are the tutor inside "Lernpfad", a one-to-one study app. Teach this learner toward a concrete goal, one small reasoning step at a time.

METHOD
1. Goal first. If the topic has no concrete goal yet, ask ONE question to pin it down (what they want to be able to do, and by when).
2. Check-in (probe) only if the topic has no probe yet. Find where understanding ends for each prerequisite strand: a floor (reliably right) and a ceiling (wrong/unknown). One question per turn. Start near the hardest thing the goal needs; jump up after a confident right answer, step down after a wrong one. At most 6 probe questions in total. "I don't know" is a fine answer that sets a ceiling; never make it feel like an exam. If the learner asks to skip, stop probing.
3. Plan once the probe is done: the smallest set of steps from what they already hold to the goal. Skip what they know; nothing off-path. 3-8 steps, short titles.
4. Teach ONE reasoning step per turn. Connect it to something they already hold, give one concrete example tied to their goal and background, and keep the message short (about 40-150 words; a worked example may run longer). Prefer asking them to predict before you reveal. Every teaching step ends with a check question.
5. When a check fails, find the exact misunderstanding and repair it before moving on. Never build on an unchecked step. Hints: the smallest one that unblocks.
6. Practice sessions: mixed, interleaved problems on what they already learned (see notes and records). No new material unless a repair is needed.
7. Accuracy: state only what you are confident is true. For precise facts (grammar rules, formulas, standards, numbers) mention a trusted source by name. Say so when unsure.
8. Language topics: write everything in ENGLISH (explanations, feedback, hints, recaps, the check question itself, book references), even if earlier turns in this session were in German. Use the target language only for what is being taught: example sentences, new words and structures, and the material inside an exercise. Put the English meaning next to every target-language sentence or new word, except when producing that meaning is the exercise. Make the learner produce language (translate, fill gaps, build sentences), not only recognize it. Correct mistakes gently and show the corrected sentence with a short English note on what changed and why.
9. Time: respect the minutes left. When 2 or fewer minutes remain, or the session's chunk is done, close with a 2-3 line recap and set phase "wrap".
10. Course materials: when the topic lists the learner's own books, use their syllabus as the backbone of the plan, in its order, starting where the probe places the learner. When you teach a point, name where it lives in the books (e.g. "Kursbuch A2, Kapitel 5, p.54; Grammatik A1–B1, adjectives section; more practice: Übungsbuch A2 Kapitel 5"). You only have the contents index, so never invent exercise numbers or quote the books. Report the chapter you are working in with "course".
11. Spoken answers: the learner often answers by speech-to-text and switches between English and German mid-answer. Read answers charitably: a misheard word, odd spelling, missing capitals or punctuation are usually transcription, not language mistakes, so don't grade them. Judge the German he clearly produced (word choice, word order, endings, verb forms). If a key word is too garbled to judge, ask him to repeat just that part instead of guessing. When an answer ends with a "[Spoken: "…" · …]" note from his voice app: the text above the note is what he means (he corrected it); the quoted transcript is what he actually said; the rest describes how it sounded (pauses and where, fillers, restarts, German/English share and the English parts, words the recognizer found unclear, edits he made after speaking, and a certainty rating). Use it like a teacher listening: long pauses or restarts right before a word mean that word or structure is shaky; English parts show vocabulary he didn't have in German; edits after speaking show what he could fix on reflection but not produce live. Grade the corrected text, but mention live-production gaps when they matter, and let the certainty rating guide whether to move on or reinforce. Unclear-to-recognizer words may hint at pronunciation; mention that only gently and only if it repeats. The note may come from the app's built-in dictation instead: there "(same as the text above)" means he sent the transcript unedited, the German/English split comes from him tapping DE/EN as he switched (an English word recognized in German mode, or the reverse, can come out garbled, so treat odd words near a switch as transcription), and pause timings are approximate.
12. Tone: warm, direct, no filler, no praise inflation. Do not narrate your method. Plain text math (e.g. θ, ẋ = Ax + Bu); no LaTeX.

OUTPUT FORMAT (strict)
Write the message for the learner in Markdown. Do NOT put the check question in the message: it goes in "ask.prompt". Then a line containing only ===CONTROL=== and then ONE JSON object:
{"phase":"goal|probe|teach|practice|wrap",
 "grade":{"result":"right|partial|wrong|none","note":"one line on their previous answer, or empty"},
 "ask":{"type":"mc|short|predict|none","prompt":"the question","options":["only for mc"],"correct":0,"explain":"why the answer is right (shown after they answer); for short/predict also the expected answer"},
 "goal":"concrete goal if just established, else null",
 "probe":{"done":true,"level":"short label of where they are","strands":[{"name":"","floor":"","ceiling":"","misconceptions":[""]}]} or null,
 "plan":[{"id":"p1","title":"","status":"todo|doing|done"}] or null (send the whole plan whenever it changes or a step's status changes),
 "record":"one sentence if they just DEMONSTRATED something non-trivial, stated prior knowledge, or fixed a misconception; else null",
 "speak":"short target-language phrase worth hearing aloud, or null",
 "course":{"level":"A2","ch":5} or null (only when the topic has course materials and the chapter you are working in changed)}
mc rules: 3-4 options of similar length and style, exactly one correct, "correct" is its 0-based index; the app shuffles and grades them. For a preference or choice with no right answer (goals, pace, what to study next), use mc with "correct": -1 and the app records the choice without grading it. Use mc for quick checks, short/predict when producing the answer matters. Use type "none" only for the final wrap message or when you just answered a side question and want them to continue.`;

function profileText(){
  const p = S.profile || {}; const L = [];
  if (p.name) L.push("Name: " + p.name);
  if (p.about) L.push("About: " + p.about);
  if (p.background && p.background.length) L.push("Background: " + p.background.join("; "));
  if (p.goals && p.goals.length) L.push("Goals: " + p.goals.join("; "));
  if (p.motivation) L.push("Motivation: " + p.motivation);
  if (p.routine) L.push("Study routine: " + p.routine);
  if (p.preferences && p.preferences.length) L.push("How they like to learn: " + p.preferences.join("; "));
  if (p.knowledge && p.knowledge.length) L.push("Known levels: " + p.knowledge.map(k => k.area + " = " + k.level + (k.evidence ? " (" + k.evidence + ")" : "")).join("; "));
  if (p.languages) L.push("Languages: " + p.languages);
  return L.join("\n").slice(0, 3000) || "(no profile yet)";
}
const LEVELS = ["A1","A2","B1","B2","C1"];
function courseLevel(t){
  if (t.coursePos && t.coursePos.level) return t.coursePos.level;
  const m = String(t.level || "").match(/\b(A1|A2|B1|B2|C1)\b/); return m ? m[1] : null;
}
function materialsText(t, id){
  const m = S.materials[id]; if (!m || !m.syllabus) return "";
  const cur = courseLevel(t); const ci = LEVELS.indexOf(cur);
  const near = lv => ci < 0 || LEVELS.indexOf(lv) === ci || LEVELS.indexOf(lv) === ci + 1;
  const L = ["COURSE MATERIALS (the learner's own books; you only have this contents index, not the book text):"];
  (m.books || []).forEach(b => L.push("- " + b.name + ": " + b.role));
  const byLv = {}; m.syllabus.forEach(c => (byLv[c.level] ||= []).push(c));
  Object.entries(byLv).forEach(([lv, chs]) => {
    if (near(lv)) chs.forEach(c => L.push(lv + " K" + c.ch + " \"" + c.title + "\" (Kursbuch p." + c.page + "): " + c.can + " | grammar: " + c.grammar));
    else L.push(lv + ": " + chs.map(c => "K" + c.ch + " " + c.title).join("; "));
  });
  if (t.coursePos) L.push("Learner is currently at: " + t.coursePos.level + " Kapitel " + t.coursePos.ch);
  return L.join("\n");
}
function topicText(t){
  const L = ["Title: " + t.title];
  if (t.why) L.push("Why: " + t.why);
  if (t.goal) L.push("Concrete goal: " + t.goal);
  if (t.level) L.push("Current level: " + t.level);
  if (t.probe && t.probe.strands) L.push("Probe result: " + t.probe.strands.map(s => s.name + " [floor: " + s.floor + "; ceiling: " + s.ceiling + (s.misconceptions && s.misconceptions.filter(Boolean).length ? "; misconceptions: " + s.misconceptions.join(", ") : "") + "]").join(" | "));
  else L.push("Probe: not done yet");
  if (t.plan && t.plan.length) L.push("Plan: " + t.plan.map(p => p.id + " " + p.title + " (" + p.status + ")").join("; "));
  else L.push("Plan: none yet");
  if (t.records && t.records.length) L.push("Learning records (latest last): " + t.records.slice(-10).map(r => r.text).join(" | "));
  if (t.summaryMd) L.push("Current summary note:\n" + t.summaryMd.slice(0, 2500));
  if (t.nextUp) L.push("Next up (from last session): " + t.nextUp);
  const mt = materialsText(t, t.id || Object.keys(S.topics).find(k => S.topics[k] === t)); if (mt) L.push(mt);
  if (t.chatContext && t.chatContext.status === "done" && t.chatContext.text) L.push("Context from the learner's past chats with Claude (they flagged this topic as related):\n" + String(t.chatContext.text).slice(0, 2000));
  return L.join("\n");
}
function minutesLeft(sess){ return Math.max(0, Math.round(sess.budgetMin - (Date.now() - Date.parse(sess.startedAt)) / 60000)); }
function buildMessages(sess){
  const t = S.topics[sess.topicId] || {};
  const head = TEACHER_RULES + "\n\n=== LEARNER PROFILE ===\n" + profileText() + "\n\n=== TOPIC ===\n" + topicText(t) +
    "\n\n=== SESSION ===\nKind: " + (sess.kind === "practice" ? "practice (mixed problems on learned material)" : "lesson") + "\nDevice/day: " + dayPlan().label + "\nMinutes left: " + minutesLeft(sess) + " of " + sess.budgetMin;
  const msgs = [{role:"user", content: head}];
  const turns = sess.turns.slice(-18);
  if (sess.turns.length > 18) msgs.push({role:"user", content:"(Earlier turns of this session are omitted. The plan and records above are current.)"});
  for (const tr of turns){
    if (tr.r === "t"){
      let c = tr.text || "(no text)";
      if (tr.ctl && tr.ctl.ask && tr.ctl.ask.type !== "none"){
        const a = tr.ctl.ask;
        c += "\n\n[My check (" + a.type + "): " + a.prompt + (a.options ? " | options: " + a.options.map((o,i) => i + ") " + o).join(" ") + " | correct: " + a.correct : "") + " | expected/explain: " + (a.explain||"") + "]";
      }
      msgs.push({role:"assistant", content: c.slice(0, 5000)});
    } else {
      msgs.push({role:"user", content: tr.text.slice(0, 3000)});
    }
  }
  if (msgs[msgs.length-1].role !== "user") msgs.push({role:"user", content:"Start the session."});
  return msgs;
}
function splitReply(text){
  const i = text.indexOf("===CONTROL===");
  if (i < 0) return {msg:text.replace(/=+C?O?N?T?R?O?L?=*\s*$/,""), ctl:null};
  const msg = text.slice(0, i).trim(); const rest = text.slice(i + 13);
  let ctl = null; const a = rest.indexOf("{"), b = rest.lastIndexOf("}");
  if (a >= 0 && b > a){ try{ ctl = JSON.parse(rest.slice(a, b+1)); }catch(e){ ctl = null; } }
  return {msg, ctl};
}
function tierFor(sess){
  const d = st().depth; if (d === "quick" || d === "complex") return d;
  return "default";
}

async function startSession(topicId, kind){
  if (!S.sample){ toast("Claude isn't available on this page right now."); return; }
  const existing = Object.values(S.openSessions).find(s => s.topicId === topicId && s.kind === kind);
  if (existing) return resumeSession(existing.id);
  const t = S.topics[topicId]; if (!t) return;
  if (t.status !== "active") saveTopic(topicId, {status:"active"});
  const sess = {id: uid("s"), topicId, kind, startedAt: nowIso(), updatedAt: nowIso(), budgetMin: dayPlan().minutes, status:"open", turns: []};
  S.live = sess; S.liveFb = {}; saveSession(sess);
  go("study"); await teacherTurn(null);
}
function resumeSession(id){
  const s = S.openSessions[id]; if (!s) return;
  if (!S.topics[s.topicId]){ toast("That topic was deleted."); return; }
  S.live = JSON.parse(JSON.stringify(s)); S.liveFb = {};
  if (minutesLeft(S.live) <= 0) S.live.budgetMin = Math.round((Date.now() - Date.parse(S.live.startedAt))/60000) + 10;
  go("study");
}

async function teacherTurn(learnerText){
  const sess = S.live; if (!sess || S.busy) return;
  if (learnerText){ sess.turns.push({r:"l", text: learnerText, at: nowIso()}); }
  S.busy = true; S.streamText = ""; S.dockMin = false; S.ctl = new AbortController();
  try{
    renderMsgs(); renderDock();
    const res = await S.sample(buildMessages(sess), {
      cache:false, signal:S.ctl.signal, modelTier: tierFor(sess),
      onText: ({text}) => { const {msg} = splitReply(text); S.streamText = msg; const el = $("#liveMsg"); if (el && msg.trim()) el.innerHTML = '<div class="prose">' + md(msg) + '</div>'; }
    });
    let {msg, ctl} = splitReply(res.text);
    if (!ctl) ctl = {phase:"teach", ask:{type:"short", prompt:"Your answer or question:", explain:""}, grade:{result:"none"}};
    sess.turns.push({r:"t", text: msg, ctl, at: nowIso()});
    applyControl(sess, ctl);
  }catch(e){
    if (e && e.code === "cancelled"){ toast("Stopped"); }
    else { toast(sampleErr(e), 4000); S.retryFlag = true; }
  }finally{
    S.busy = false; S.streamText = ""; S.ctl = null; sess.updatedAt = nowIso(); saveSession(sess);
    renderMsgs(); renderDock(); updateStudyHead();
  }
}
function applyControl(sess, ctl){
  const id = sess.topicId; const t = S.topics[id] || {}; const up = {updatedAt: nowIso(), lastStudied: nowIso()};
  if (ctl.goal) up.goal = String(ctl.goal);
  if (ctl.probe && ctl.probe.done){ up.probe = {done:true, strands: (ctl.probe.strands||[]).slice(0,8), at: nowIso()}; if (ctl.probe.level) up.level = String(ctl.probe.level); }
  if (Array.isArray(ctl.plan) && ctl.plan.length) up.plan = ctl.plan.slice(0,12).map((p,i) => ({id: String(p.id||("p"+(i+1))), title: String(p.title||""), status: ["todo","doing","done"].includes(p.status) ? p.status : "todo"}));
  if (ctl.course && ctl.course.level && ctl.course.ch) up.coursePos = {level: String(ctl.course.level), ch: Number(ctl.course.ch) || 1, at: nowIso()};
  if (ctl.record && String(ctl.record).trim().length > 8) up.records = (t.records||[]).concat([{at: nowIso(), text: String(ctl.record).slice(0,300)}]).slice(-40);
  saveTopic(id, up);
  if (up.plan) syncKcs(id);
}

async function finishSession(silent){
  if (S.finishing) return;
  S.finishing = true;
  try{ await finishSessionRun(silent); } finally { S.finishing = false; }
}
async function finishSessionRun(silent){
  const sess = S.live; if (!sess) return;
  const t = S.topics[sess.topicId] || {};
  const learnerTurns = sess.turns.filter(x => x.r === "l").length;
  if (!learnerTurns || !S.sample){
    sess.status = "closed"; sess.endedAt = nowIso();
    if (await saveSession(sess) === false){ sess.status = "open"; delete sess.endedAt; return; }
    S.live = null; if (!silent) go("topic-" + sess.topicId); else render(true); return;
  }
  const existingFronts = Object.values(S.cards).filter(c => c.topicId === sess.topicId).map(c => c.front).slice(-60);
  const transcript = sess.turns.map(x => x.r === "t" ? "TUTOR: " + x.text + (x.ctl && x.ctl.ask && x.ctl.ask.type !== "none" ? "\n[check: " + x.ctl.ask.prompt + " | answer: " + (x.ctl.ask.options ? x.ctl.ask.options[x.ctl.ask.correct] : x.ctl.ask.explain) + "]" : "") : "LEARNER: " + x.text).join("\n\n").slice(-60000);
  const hasVocab = Object.values(S.cards).some(c => c.topicId === sess.topicId && c.kind === "vocab");

Note rules (it is also saved to their Obsidian vault):
- First person, like the learner's own notes ("I learned…" is not needed; write the ideas as "X means Y"). Short lines, plain Markdown, no HTML, no LaTeX.
- Sections in this order: ## Why · ## Where I am · ## Key ideas · ## Glossary (term — one-line definition) · ## Mistakes I fixed · ## Next up · ## Sources
- Include only what was taught AND checked, or what they showed they know. Merge with the existing note: keep its still-true content, update, never duplicate. Under 600 words.
- Sources: real, well-known references only (textbooks, official docs, recognised sites). If unsure of a URL, give the title without a URL. If the topic has course materials, list the book chapters used this session first (e.g. "Netzwerk neu Kursbuch A2, Kapitel 5, p.54").
Cards: 0-6 NEW concept cards, only for ideas taught and checked this session, not duplicating existing fronts. The learner wants to understand rules and concepts, not memorize answers, so NEVER make a card whose answer is a fixed phrase or sentence to learn by heart: no "translate this sentence" cards, no "how do you say…" cards, and never reuse a sentence from the session as a card's answer. Each card must make the learner reason with a rule or concept, using one of these types:
- "choose": which rule, concept or method applies here, and why (e.g. "weil or denn: which one sends the verb to the end?"; "PID or bang-bang control for this case?").

- "word": a single vocabulary item with its key forms (for German nouns: article and plural). ${hasVocab ? "This topic already has imported vocabulary cards, so do NOT make word cards." : "Only for new words that were taught and checked; at most 2."}
Mix the types; prefer "fix" and "apply". The back gives the answer and a one-line reason. Fronts are in English; target-language material appears only inside the example being judged.

=== LEARNER PROFILE ===
${profileText()}

=== TOPIC ===
${topicText(t)}

=== EXISTING CARD FRONTS ===
${existingFronts.join(" | ") || "(none)"}

=== SESSION TRANSCRIPT (${sess.kind}) ===
${transcript}`;
  const close = dialog('<h2>Saving to your note</h2><p class="muted"><span class="spin"></span> Updating the summary note and making review cards from this session…</p>', null, {persistent:true});
  try{

/* ---------------- dictation: language switch + how the answer sounded ---------------- */
// Claude's dictation recognizes one language per listening session, so the DE/EN button restarts it in the other language.
// The page gets words, not sound: pauses are measured from when words arrive (approximate, includes recognizer delay).
const PAUSE_MS = 1800;
function dictLang(){ if (!S.dictLangV){ let v = null; try{ v = localStorage.getItem("lp-dict-lang"); }catch(e){} S.dictLangV = v === "en" ? "en" : "de"; } return S.dictLangV; }

function dictStart(mb){
  const useLang = S.dictLangOk !== false; S.dictLangTried = useLang;
  const p = useLang ? S.dict.start({language: dictLang()}) : S.dict.start();
  Promise.resolve(p).catch(e => {
    const c = e && e.code;
    if (c === "not_granted"){ S.dict = null; const w = mb.closest(".micwrap"); (w || mb).remove(); }
    else if (c === "unavailable" && useLang){ S.dictLangOk = false; const lb = document.getElementById("langBtn"); if (lb) lb.remove(); toast("That language isn't offered for dictation here. Tap the mic again to use your default language."); }

}
function spReset(ta){ S.sp = {ta, finals:[], pauses:[], lastAt:0, switches:0}; }
function spTail(sp){ const w = sp.finals.map(f => f.text).join("").trim().split(/\s+/); return w.slice(-3).join(" "); }
function spPartial(text){
  const sp = S.sp; if (!sp || !text) return; const now = Date.now();
  if (sp.lastAt && now - sp.lastAt > PAUSE_MS && sp.finals.length) sp.pauses.push({ms: now - sp.lastAt, after: spTail(sp)});

function spFinal(ta, text){

  const sp = S.sp; sp.finals.push({text, lang: S.dictLangOk === false ? "auto" : dictLang()}); sp.lastAt = Date.now();

const spWords = t => (t.toLowerCase().match(/[\p{L}\p{N}']+/gu) || []);
function spDiff(a, b){ // word-level changes from spoken (a) to sent (b)

    else if (j < m && (i >= n || L[i][j+1] >= L[i+1][j])) ins.push(b[j++]);
    else del.push(a[i++]);
  }

}
function spokenNote(ta, sent, confidence){
  const sp = S.sp; if (!sp || sp.ta !== ta || !sp.finals.length) return "";
  const spoken = sp.finals.map(f => f.text).join("").trim().replace(/\s+/g, " ");
  const sw = spWords(spoken), parts = [];
  const sec = ms => (ms/1000).toFixed(1) + " s";
  if (sp.pauses.length){
    const ps = sp.pauses.slice(0, 5).map(p => sec(p.ms) + (p.after ? ' after "' + p.after + '"' : ""));
    parts.push(sp.pauses.length + " pause" + (sp.pauses.length > 1 ? "s" : "") + " (" + ps.join("; ") + (sp.pauses.length > 5 ? "; …" : "") + ")");
  } else parts.push("no long pauses");

    let l = "German " + Math.round(cnt.de/tot*100) + "% / English " + Math.round(cnt.en/tot*100) + "%";

}

/* ---------------- spaced repetition (FSRS-4.5, local: costs no Claude usage) ---------------- */
const W = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const FACTOR = 19/81, DECAY = -0.5;
const clampD = d => Math.min(10, Math.max(1, d));
const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);

const nextD = (d, g) => clampD(W[7] * initD(4) + (1 - W[7]) * (d - W[6] * (g - 3)));
const sRecall = (d, s, r, g) => s * (Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp(W[10] * (1 - r)) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1) + 1);

    n.d = nextD(c.d, g); n.s = g === 1 ? Math.min(sForget(c.d, c.s, r), c.s) : sRecall(c.d, c.s, r, g);
  }
  if (g === 1){ n.lapses = (c.lapses||0) + (c.s ? 1 : 0); days = 10 / 1440; }
  else days = Math.max(1, Math.round(n.s));
  n.reps = (c.reps||0) + 1; n.last = new Date(now).toISOString(); n.due = new Date(now + days * DAY).toISOString();
  return {card:n, days};
}
const fmtIv = d => d < 1 ? Math.round(d*1440) + "m" : d < 31 ? Math.round(d) + "d" : d < 365 ? Math.round(d/30) + "mo" : (d/365).toFixed(1) + "y";
