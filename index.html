    S.review = {topicId, queue:q, i:0, shown:false, done:0};
  }
  return '<div class="stack"><div class="bar"><h1>Review</h1><span class="sp"></span><select id="revFilter" aria-label="Topic filter" style="width:auto"><option value="">All topics</option>'+topicsWithCards.map(id => '<option value="'+esc(id)+'">'+esc(S.topics[id].title)+'</option>').join("")+'</select></div>' +
    '<p class="muted small" style="margin:0">Spaced repetition runs right here on your device, so reviewing doesn\'t use your Claude usage.</p><div id="revBox"></div></div>';
}
function bindReview(){
  const f = $("#revFilter"); f.value = S.reviewTopic || "";
  f.onchange = () => { S.reviewTopic = f.value || null; S.review = null; render(true); };
  drawCard();
}
function drawCard(){
  const box = $("#revBox"); const R = S.review; if (!box) return;
  while (R.i < R.queue.length && !S.cards[R.queue[R.i]]) R.i++;
  if (R.i >= R.queue.length){
    const next = Object.values(S.cards).filter(c => c.due && (!R.topicId || c.topicId === R.topicId)).map(c => c.due).sort()[0];
    box.innerHTML = '<div class="card stack"><h2>'+(R.done ? "Done for now" : "Nothing due")+'</h2><p class="muted">'+(R.done ? R.done + " card"+(R.done>1?"s":"")+" reviewed. " : "") + (next ? "Next card is due " + fmtDate(next) + "." : "Cards appear here after your lessons.")+'</p><div class="bar"><a class="btn" href="#today">Back to today</a></div></div>';
    S.review = null; return;
  }
  const id = R.queue[R.i]; const c = S.cards[id]; const t = S.topics[c.topicId] || {}; const now = Date.now();
  if (!R.shown) R.t0 = now;
  box.innerHTML = '<div class="card flash"><div class="bar"><span class="eyebrow">'+esc(t.title||"")+'</span><span class="sp"></span><span class="small muted">'+(R.i+1)+' / '+R.queue.length+'</span></div>' +
    '<div class="prose" style="font-size:1.15rem">'+md(c.front)+'</div>' +
    (R.shown ? '<hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="prose">'+md(c.back)+'</div>' + (S.tts ? '<div><button class="btn ghost sm" id="hear">'+I.spk+' Hear answer</button></div>' : "")
             : '<textarea id="tryAns" placeholder="Optional: type your answer first" aria-label="Your answer" style="min-height:52px"></textarea>') +
    '</div>' +
    (R.shown ? '<div class="rate">' + [[1,"Again"],[2,"Hard"],[3,"Good"],[4,"Easy"]].map(([g,l]) => '<button class="btn'+(g===3?' primary':'')+'" data-g="'+g+'">'+l+'<small>'+fmtIv(schedule(c,g,now).days)+'<span class="hint"> · '+g+'</span></small></button>').join("") + '</div>'
             : '<div class="bar"><button class="btn primary" id="showAns">Show answer <span class="kbd hint">Space</span></button><span class="sp"></span><button class="btn ghost sm" id="suspend">Skip this card for good</button></div>');
  if (!R.shown){
    $("#showAns").onclick = () => { R.typed = ($("#tryAns")||{}).value || ""; R.shown = true; drawCard(); };
    $("#suspend").onclick = () => { saveCard(id, Object.assign({}, c, {suspended:true})); R.i++; drawCard(); };
  } else {
    if (R.typed){ const p = document.createElement("p"); p.className = "small muted"; p.textContent = "You wrote: " + R.typed; $(".flash").appendChild(p); }
    const h = $("#hear"); if (h) h.onclick = () => speak(c.back.replace(/[*_`#>]/g,""));
    $$("[data-g]").forEach(b => b.onclick = () => {
      const g = +b.dataset.g; logReview(c, g, Date.now() - (R.t0 || Date.now())); const {card} = schedule(c, g, Date.now()); saveCard(id, card);
      if (g === 1) R.queue.push(id);
      R.i++; R.shown = false; R.typed = ""; R.done++; drawCard();
    });
  }
}

/* ---------------- statistics (modelled on Anki's: one summary document per day, not one per review) ----------------
   Per topic and day: n reviews, again presses, nw = first reviews of new cards, ln = relearning steps (<1 day),
   yp/yf = passed/failed young reviews (previous interval < 21 days), mp/mf = the same for mature cards, ms = answer time (capped at 60 s).
   h / hp = reviews and passes by hour of day (all topics). True retention = passed / (passed + failed), like Anki. */
const MATURE_DAYS = 21;
const ivlDays = c => (c && c.s && c.last && c.due) ? (Date.parse(c.due) - Date.parse(c.last)) / DAY : null;
function logReview(c, g, ms){
  if (!S.db || !c) return;
  const day = ymd(Date.now()), hr = new Date().getHours();
  const old = S.stats[day] || {};
  const d = {date: day, t: Object.assign({}, old.t || {}), h: (old.h && old.h.length === 24) ? old.h.slice() : Array(24).fill(0), hp: (old.hp && old.hp.length === 24) ? old.hp.slice() : Array(24).fill(0), updatedAt: nowIso()};
  const tid = c.topicId || "none";
  const x = Object.assign({n:0, again:0, nw:0, ln:0, yp:0, yf:0, mp:0, mf:0, ms:0}, d.t[tid] || {});
  x.n++; if (g === 1) x.again++; x.ms += Math.max(0, Math.min(ms || 0, 60000));
  const iv = ivlDays(c);
  if (iv === null) x.nw++;
  else if (iv < 1) x.ln++;
  else if (iv < MATURE_DAYS){ if (g === 1) x.yf++; else x.yp++; }
  else { if (g === 1) x.mf++; else x.mp++; }
  d.t[tid] = x; d.h[hr]++; if (g !== 1) d.hp[hr]++;
  S.stats[day] = d;
  queueWrite("stats/" + day, () => S.db.doc("stats/" + day).set(clean(d)));
}
function statDay(d, tid){
  const z = {n:0, again:0, nw:0, ln:0, yp:0, yf:0, mp:0, mf:0, ms:0}; if (!d || !d.t) return z;
  Object.entries(d.t).forEach(([k, x]) => { if (!tid || k === tid) Object.keys(z).forEach(f => z[f] += (x && x[f]) || 0); });
  return z;
}
function statRange(fromDay, toDay, tid){
  const z = statDay(null);
  Object.values(S.stats).forEach(d => { if (d.date >= fromDay && d.date <= toDay){ const x = statDay(d, tid); Object.keys(z).forEach(f => z[f] += x[f]); } });
  return z;
}
const dayStr = off => ymd(Date.now() + off * DAY);
function pct(p, f){ const n = p + f; return n ? '<b>' + Math.round(100 * p / n) + '%</b> <span class="muted">' + p + '/' + n + '</span>' : '<span class="muted">–</span>'; }
function barChart(vals, labels, tips, ariaLabel){
  const max = Math.max(1, ...vals);
  return '<div class="chart" role="group" aria-label="' + esc(ariaLabel) + '"><div class="ymax">' + max + '</div><div class="bars">' +
    vals.map((v, i) => '<div class="col" role="button" tabindex="0" aria-label="' + esc(tips[i]) + '" data-tip="' + esc(tips[i]) + '"><i style="height:' + (v ? Math.max(2, Math.round(100 * v / max)) : 0) + '%"></i></div>').join("") +
    '</div><div class="xlab">' + labels.map(l => '<span>' + esc(l) + '</span>').join("") + '</div><div class="ctip muted" aria-live="polite">Point at or tap a bar for details.</div></div>';
}
function viewStats(){
  const tid = S.statsTopic || "";
  const topicsWithCards = [...new Set(Object.values(S.cards).map(c => c.topicId))].filter(id => S.topics[id]);
  const today = dayStr(0), td = statRange(today, today, tid);
  const days = Object.keys(S.stats).sort(); const first = days[0];
  // card counts
  const cards = Object.values(S.cards).filter(c => !tid || c.topicId === tid);
  const cnt = {nw:0, ln:0, young:0, mature:0, susp:0};
  cards.forEach(c => { if (c.suspended) cnt.susp++; else { const iv = ivlDays(c); if (iv === null) cnt.nw++; else if (iv < 1) cnt.ln++; else if (iv < MATURE_DAYS) cnt.young++; else cnt.mature++; } });
  const newDueToday = cards.filter(c => !c.suspended && ivlDays(c) === null && (!c.due || Date.parse(c.due) <= Date.now())).length;
  // retention table
  const periods = [["Today", today, today], ["Yesterday", dayStr(-1), dayStr(-1)], ["Last 7 days", dayStr(-6), today], ["Last 30 days", dayStr(-29), today], ["Last year", dayStr(-364), today], ["All time", "0000", today]];
  const rows = periods.map(([l, a, b]) => { const x = statRange(a, b, tid); return '<tr><td>' + l + '</td><td>' + pct(x.yp, x.yf) + '</td><td>' + pct(x.mp, x.mf) + '</td><td>' + pct(x.yp + x.mp, x.yf + x.mf) + '</td><td>' + x.n + '</td></tr>'; }).join("");
  // reviews per day, last 30 days
  const rv = [], rl = [], rt = [];
  for (let k = -29; k <= 0; k++){ const ds = dayStr(k); const x = statDay(S.stats[ds], tid); rv.push(x.n); rt.push(fmtDate(ds + "T12:00:00") + ": " + x.n + " reviews (" + x.nw + " new, " + x.again + " Again), " + Math.round(x.ms / 60000) + " min"); }
  rl.push("30 days ago", "today");
  // due in the next 30 days
  const fv = Array(30).fill(0), ft = [];
  const startToday = new Date(); startToday.setHours(0,0,0,0);
  cards.forEach(c => { if (c.suspended) return; const due = c.due ? Date.parse(c.due) : Date.now(); const k = Math.max(0, Math.floor((due - startToday.getTime()) / DAY)); if (k < 30) fv[k]++; });
  for (let k = 0; k < 30; k++) ft.push((k === 0 ? "Today (incl. overdue)" : k === 1 ? "Tomorrow" : fmtDate(new Date(startToday.getTime() + k * DAY + 12 * 3600000))) + ": " + fv[k] + " cards");
  // hours, last 30 days, all topics
  const hv = Array(24).fill(0), hpv = Array(24).fill(0);
  Object.values(S.stats).forEach(d => { if (d.date >= dayStr(-29) && d.h){ d.h.forEach((v, i) => hv[i] += v || 0); (d.hp || []).forEach((v, i) => hpv[i] += v || 0); } });
  const htips = hv.map((v, i) => String(i).padStart(2, "0") + ":00: " + v + " reviews" + (v ? ", " + Math.round(100 * hpv[i] / v) + "% not Again" : ""));
  return '<div class="stack"><div class="bar"><h1>Stats</h1><span class="sp"></span><select id="statFilter" aria-label="Topic filter" style="width:auto"><option value="">All topics</option>' + topicsWithCards.map(id => '<option value="' + esc(id) + '">' + esc(S.topics[id].title) + '</option>').join("") + '</select></div>' +
    '<p class="muted small" style="margin:0">' + (first ? 'History since ' + fmtDate(first + "T12:00:00") + '.' : 'History starts with your next review.') + ' Built like Anki\'s statistics: true retention counts reviews where you didn\'t press Again; cards count as mature once their interval reaches 21 days.</p>' +
    '<div class="tiles">' +
      '<div class="tile"><div class="eyebrow">Reviewed today</div><div class="n">' + td.n + '</div><span class="small muted">' + Math.round(td.ms / 60000) + ' min · ' + td.nw + ' new · ' + td.again + ' Again</span></div>' +
      '<div class="tile"><div class="eyebrow">Due now</div><div class="n">' + dueCards(tid || null).length + '</div><span class="small muted">' + newDueToday + ' of them new</span></div>' +
      '<div class="tile"><div class="eyebrow">Retention today</div><div class="n">' + ((td.yp + td.mp + td.yf + td.mf) ? Math.round(100 * (td.yp + td.mp) / (td.yp + td.mp + td.yf + td.mf)) + '<span class="small">%</span>' : '–') + '</div><span class="small muted">reviews of cards you\'d seen before</span></div>' +
    '</div>' +
    '<section class="card stack" style="gap:10px"><h2>True retention</h2><div style="overflow-x:auto"><table class="stbl"><thead><tr><th>Period</th><th>Young</th><th>Mature</th><th>Total</th><th>Reviews</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="small muted" style="margin:0">Young: interval under 21 days. Mature: 21 days or more. First reviews of new cards and same-day relearning steps aren\'t counted, as in Anki.</p></section>' +
    '<section class="card stack" style="gap:10px"><h2>Reviews per day</h2><p class="small muted" style="margin:0">Last 30 days</p>' + barChart(rv, rl, rt, "Reviews per day over the last 30 days") + '</section>' +
    '<section class="card stack" style="gap:10px"><h2>Due in the next 30 days</h2>' + barChart(fv, ["today", "in 30 days"], ft, "Cards due per day for the next 30 days") + '</section>' +
    '<section class="card stack" style="gap:10px"><h2>Card counts</h2><table class="stbl"><tbody>' +
      [["New (not studied yet)", cnt.nw], ["Learning (interval under 1 day)", cnt.ln], ["Young (under 21 days)", cnt.young], ["Mature (21 days or more)", cnt.mature], ["Suspended", cnt.susp], ["Total", cards.length]].map(([l, v]) => '<tr><td>' + l + '</td><td>' + v + '</td></tr>').join("") +
    '</tbody></table></section>' +
    '<section class="card stack" style="gap:10px"><h2>Time of day</h2><p class="small muted" style="margin:0">Reviews by hour, last 30 days, all topics</p>' + barChart(hv, ["00:00", "12:00", "23:00"], htips, "Reviews by hour of day") + '</section>' +
  '</div>';
}
function bindStats(){
  const f = $("#statFilter"); if (f){ f.value = S.statsTopic || ""; f.onchange = () => { S.statsTopic = f.value || null; render(true); }; }
  $$(".chart").forEach(ch => {
    const tip = $(".ctip", ch);
    $$(".col", ch).forEach(col => {
      const show = () => { $$(".col.on", ch).forEach(x => x.classList.remove("on")); col.classList.add("on"); tip.textContent = col.dataset.tip; tip.classList.remove("muted"); };
      col.onpointerenter = show; col.onclick = show; col.onfocus = show;
    });
  });
}

/* ---------------- views: Settings ---------------- */
function viewSettings(){
  const s = st();
  return '<div class="stack"><h1>Settings</h1>' +
   '<div class="card stack"><div class="bar"><div><h2>Appearance</h2><p class="small muted" style="margin:2px 0 0">Follows your device unless you pick one.</p></div><span class="sp"></span><div class="seg" id="modeSeg" role="group" aria-label="Appearance"><button data-m="system">System</button><button data-m="light">Light</button><button data-m="dark">Dark</button></div></div></div>' +
   '<div class="card stack"><h2>Obsidian</h2><p class="small muted" style="margin:0">The daily Claude sync copies every topic note into this folder of your vault. On any device you can also use Copy, Download .md (opens the share sheet on iPhone) or Open in Obsidian on a topic\'s note.</p>' +
    '<label class="f" for="sVault">Vault name<input type="text" id="sVault" value="'+esc(s.vault)+'"></label><label class="f" for="sFolder">Folder in the vault<input type="text" id="sFolder" value="'+esc(s.folder)+'"></label></div>' +
   '<div class="card stack"><h2>Sessions</h2><label class="f" for="sWd">Weekday session length (minutes)<input type="text" inputmode="numeric" id="sWd" value="'+esc(s.weekdayMin)+'"></label><label class="f" for="sWe">Saturday session length (minutes)<input type="text" inputmode="numeric" id="sWe" value="'+esc(s.weekendMin)+'"></label>' +
    '<div class="f">Teaching depth<div class="seg" id="depthSeg" role="group" aria-label="Teaching depth"><button data-d="quick">Fast</button><button data-d="default">Balanced</button><button data-d="complex">Deep</button></div><span class="small muted" style="font-weight:400">Fast replies instantly and uses the least of your Claude usage. Deep thinks longer and suits hard robotics or math topics.</span></div></div>' +
   '<div class="bar"><span class="sp"></span><button class="btn primary" id="sSave">Save settings</button></div>' +
   '<div class="card stack"><h2>Backup</h2><p class="small muted" style="margin:0">Everything already syncs between your devices. A backup file is for safekeeping.</p><div class="bar">'+(S.dl?'<button class="btn" id="bkDl">Download backup (.json)</button>':'<button class="btn" id="bkCp">Copy backup</button>')+'<button class="btn" id="bkBtn" type="button">Restore from backup</button><input type="file" id="bkIn" accept=".json,application/json" style="display:none"></div></div></div>';
}
function bindSettings(){
  const s = st(); let depth = s.depth;
  const pm = () => $$("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === (st().mode || "system"))); pm();
  $$("#modeSeg button").forEach(b => b.onclick = () => { applyMode(b.dataset.m); saveSettings({mode:b.dataset.m}); pm(); });
  const paint = () => $$("#depthSeg button").forEach(b => b.classList.toggle("on", b.dataset.d === depth)); paint();
  $$("#depthSeg button").forEach(b => b.onclick = () => { depth = b.dataset.d; paint(); });
  $("#sSave").onclick = async () => { const ok = await saveSettings({vault:$("#sVault").value.trim()||"Obsidian Vault", folder:$("#sFolder").value.trim().replace(/^\/+|\/+$/g,"")||"Learning", weekdayMin:Math.max(5, +$("#sWd").value||15), weekendMin:Math.max(5, +$("#sWe").value||40), depth}); toast(ok === false ? "Couldn't save your settings. Try again." : "Saved", ok === false ? 4500 : 2600); };
  const dump = () => JSON.stringify({exportedAt:nowIso(), profile:S.profile, settings:S.settings, topics:S.topics, cards:S.cards, stats:S.stats, kcs:S.kcs}, null, 1);
  const bd = $("#bkDl"); if (bd) bd.onclick = async () => { try{ await S.dl.save({filename:"lernpfad-backup-" + ymd(Date.now()) + ".json", data: dump()}); }catch(e){ if (e && e.code !== "declined") toast("Couldn't save the file here."); } };
  const bc = $("#bkCp"); if (bc) bc.onclick = () => copyText(dump());
  $("#bkBtn").onclick = () => $("#bkIn").click();
  $("#bkIn").onchange = async e => {
    const inp = e.target, f = inp.files[0]; if (!f) return;
    let d = null;
    try{ d = JSON.parse(await f.text()); }catch(err){ d = null; }
    inp.value = "";
    const isObj = v => v && typeof v === "object" && !Array.isArray(v);
    if (!isObj(d) || !(isObj(d.topics) || isObj(d.cards) || isObj(d.profile)) || [d.topics, d.cards, d.stats, d.profile, d.kcs].some(v => v != null && !isObj(v))){ toast("That file isn't a Lernpfad backup."); return; }
    if (!(await confirmBox("Restore this backup? Topics and cards with the same id are overwritten; others stay.", "Restore"))) return;
    let ok = 0, bad = 0; const tally = r => { if (r === false) bad++; else ok++; };
    if (d.profile) tally(await saveProfile(d.profile));
    for (const [id,t] of Object.entries(d.topics||{})) tally(await saveTopic(id, t));
    for (const [id,c] of Object.entries(d.cards||{})) tally(await saveCard(id, c));
    for (const [id,k] of Object.entries(d.kcs||{})) tally(await saveKc(id, k));
    for (const [day,x] of Object.entries(d.stats||{})){ S.stats[day] = x; tally(await queueWrite("stats/"+day, () => S.db.doc("stats/"+day).set(clean(x)))); }
    toast(bad ? "Restored " + ok + " of " + (ok + bad) + " items. Some couldn't be saved; try again." : "Restored", bad ? 5000 : 2600);
  };
}

/* ---------------- command palette and keyboard ---------------- */
function paletteItems(){
  const due = dueCards().length; const items = [];
  const nav = [["today","Go to Today"],["topics","Go to Topics"],["review","Go to Review" + (due ? " · " + due + " due" : "")],["stats","Go to Stats"],["settings","Go to Settings"]];
  nav.forEach(([h,l]) => items.push({grp:"Navigate", label:l, run:() => go(h)}));
  items.push({grp:"Actions", label:"New topic", run:newTopicDialog});
  Object.values(S.openSessions).forEach(sv => { const t = S.topics[sv.topicId]; if (t) items.push({grp:"Actions", label:"Resume: " + t.title, run:() => resumeSession(sv.id)}); });
  topicList(t => ["active","paused","done"].includes(t.status || "active")).sort((a,b) => (b.lastStudied||"").localeCompare(a.lastStudied||"")).forEach(t => {
    items.push({grp:"Topics", label:t.title, sub:"Open note", run:() => go("topic-" + t.id)});
    items.push({grp:"Topics", label:t.title, sub:"Start lesson", run:() => startSession(t.id, "teach")});
    items.push({grp:"Topics", label:t.title, sub:"Practice", run:() => startSession(t.id, "practice")});
  });
  return items;
}
function openPalette(){
  if ($("#overlay .modal")) return;
  const all = paletteItems(); let shown = all, idx = 0;
  const close = dialog('<div class="palette stack"><input type="text" id="palQ" placeholder="Search topics and actions…" aria-label="Search" autocomplete="off"><div class="list" id="palList" role="listbox"></div><div class="foot hint"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">esc</span> close</span></div></div>', (el) => {
    el.classList.add("palette");
    const q = $("#palQ", el), list = $("#palList", el);
    const draw = () => {
      let html = "", last = "";
      shown.forEach((it, i) => { if (it.grp !== last){ html += '<div class="grp">' + esc(it.grp) + '</div>'; last = it.grp; }
        html += '<button class="it' + (i === idx ? " on" : "") + '" data-pi="' + i + '" role="option"><span>' + esc(it.label) + '</span><span class="sp"></span>' + (it.sub ? '<span class="muted">' + esc(it.sub) + '</span>' : '') + '</button>'; });
      list.innerHTML = html || '<p class="small muted" style="padding:10px">No matches.</p>';
      $$(".it", list).forEach(b => { b.onclick = () => pick(+b.dataset.pi); b.onmousemove = () => { if (idx !== +b.dataset.pi){ idx = +b.dataset.pi; draw(); } }; });
      const on = $(".it.on", list); if (on) on.scrollIntoView({block:"nearest"});
    };
    const pick = i => { const it = shown[i]; if (!it) return; close(); it.run(); };
    q.oninput = () => { const words = q.value.toLowerCase().split(/\s+/).filter(Boolean); shown = all.filter(it => words.every(w => (it.label + " " + (it.sub||"") + " " + it.grp).toLowerCase().includes(w))); idx = 0; draw(); };
    q.onkeydown = e => {
      if (e.key === "ArrowDown"){ e.preventDefault(); idx = Math.min(shown.length - 1, idx + 1); draw(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
      else if (e.key === "Enter"){ e.preventDefault(); pick(idx); }
    };
    draw(); setTimeout(() => q.focus(), 0);
  });
}
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName || "");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openPalette(); return; }
  if (e.key === "Escape" && $("#overlay .modal")){ const m = $("#overlay .modal"); if (m._dismiss) m._dismiss(); return; }
  if (typing || $("#overlay .modal") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.route === "study"){
    const opts = $$("#dock .opt:not([disabled])");
    if (/^[1-9]$/.test(e.key) && opts[+e.key - 1]){ e.preventDefault(); opts[+e.key - 1].click(); return; }
    if (e.key === "Enter"){ const b = $("#mcNext") || $("#contBtn"); if (b){ e.preventDefault(); b.click(); } }
  } else if (S.route === "review"){
    if ((e.key === " " || e.key === "Enter") && $("#showAns")){ e.preventDefault(); $("#showAns").click(); return; }
    const g = $('[data-g="' + e.key + '"]'); if (/^[1-4]$/.test(e.key) && g){ e.preventDefault(); g.click(); }
  }
});

init();
</script>
